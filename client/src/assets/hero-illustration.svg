<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="50%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#06B6D4"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981"/>
      <stop offset="100%" style="stop-color:#3B82F6"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)" opacity="0.1" rx="20"/>
  
  <!-- Team collaboration elements -->
  <circle cx="200" cy="150" r="80" fill="url(#accent)" opacity="0.2"/>
  <circle cx="600" cy="450" r="60" fill="#8B5CF6" opacity="0.15"/>
  <circle cx="400" cy="300" r="100" fill="#3B82F6" opacity="0.1"/>
  
  <!-- Digital marketing icons/shapes -->
  <rect x="150" y="200" width="120" height="80" rx="15" fill="white" opacity="0.9" stroke="#3B82F6" stroke-width="2"/>
  <rect x="320" y="180" width="100" height="100" rx="20" fill="white" opacity="0.9" stroke="#8B5CF6" stroke-width="2"/>
  <rect x="480" y="220" width="140" height="90" rx="18" fill="white" opacity="0.9" stroke="#06B6D4" stroke-width="2"/>
  
  <!-- Analytics charts representation -->
  <rect x="170" y="320" width="6" height="40" fill="#3B82F6" rx="3"/>
  <rect x="185" y="300" width="6" height="60" fill="#8B5CF6" rx="3"/>
  <rect x="200" y="310" width="6" height="50" fill="#06B6D4" rx="3"/>
  <rect x="215" y="290" width="6" height="70" fill="#10B981" rx="3"/>
  
  <!-- Growth arrows -->
  <path d="M450 380 L500 330 L485 340 L500 330 L490 345" stroke="#10B981" stroke-width="3" fill="none"/>
  <path d="M350 420 L400 370 L385 380 L400 370 L390 385" stroke="#3B82F6" stroke-width="3" fill="none"/>
  
  <!-- Connection lines -->
  <path d="M270 240 Q350 220 420 250" stroke="#8B5CF6" stroke-width="2" fill="none" opacity="0.6" stroke-dasharray="5,5"/>
  <path d="M420 280 Q500 300 580 320" stroke="#06B6D4" stroke-width="2" fill="none" opacity="0.6" stroke-dasharray="5,5"/>
  
  <!-- Modern geometric shapes -->
  <polygon points="550,150 580,120 610,150 580,180" fill="#3B82F6" opacity="0.2"/>
  <polygon points="100,400 130,370 160,400 130,430" fill="#8B5CF6" opacity="0.2"/>
  
  <!-- Text placeholder areas -->
  <rect x="160" y="220" width="80" height="8" rx="4" fill="#3B82F6" opacity="0.3"/>
  <rect x="160" y="235" width="100" height="6" rx="3" fill="#3B82F6" opacity="0.2"/>
  <rect x="160" y="248" width="60" height="6" rx="3" fill="#3B82F6" opacity="0.2"/>
  
  <rect x="340" y="200" width="60" height="8" rx="4" fill="#8B5CF6" opacity="0.3"/>
  <rect x="340" y="215" width="80" height="6" rx="3" fill="#8B5CF6" opacity="0.2"/>
  <rect x="340" y="228" width="50" height="6" rx="3" fill="#8B5CF6" opacity="0.2"/>
</svg>