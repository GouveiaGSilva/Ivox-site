<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="office-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6"/>
      <stop offset="50%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#06B6D4"/>
    </linearGradient>
    <linearGradient id="workspace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F8FAFC"/>
      <stop offset="100%" style="stop-color:#E2E8F0"/>
    </linearGradient>
  </defs>
  
  <!-- Background gradient -->
  <rect width="800" height="600" fill="url(#office-bg)" opacity="0.05" rx="20"/>
  
  <!-- Office workspace elements -->
  <rect x="100" y="400" width="600" height="120" rx="15" fill="url(#workspace)" stroke="#CBD5E1" stroke-width="1"/>
  
  <!-- Desk/workspace surfaces -->
  <rect x="150" y="420" width="200" height="80" rx="10" fill="white" stroke="#CBD5E1" stroke-width="1"/>
  <rect x="400" y="420" width="200" height="80" rx="10" fill="white" stroke="#CBD5E1" stroke-width="1"/>
  
  <!-- Computer/laptop screens -->
  <rect x="170" y="430" width="60" height="40" rx="5" fill="#1E293B"/>
  <rect x="420" y="430" width="60" height="40" rx="5" fill="#1E293B"/>
  <rect x="520" y="430" width="60" height="40" rx="5" fill="#1E293B"/>
  
  <!-- Screen content -->
  <rect x="175" y="435" width="50" height="4" rx="2" fill="#3B82F6"/>
  <rect x="175" y="445" width="35" height="3" rx="1" fill="#8B5CF6"/>
  <rect x="175" y="453" width="45" height="3" rx="1" fill="#06B6D4"/>
  <rect x="175" y="461" width="25" height="3" rx="1" fill="#10B981"/>
  
  <rect x="425" y="435" width="50" height="4" rx="2" fill="#8B5CF6"/>
  <rect x="425" y="445" width="35" height="3" rx="1" fill="#3B82F6"/>
  <rect x="425" y="453" width="45" height="3" rx="1" fill="#10B981"/>
  
  <rect x="525" y="435" width="50" height="4" rx="2" fill="#06B6D4"/>
  <rect x="525" y="445" width="40" height="3" rx="1" fill="#3B82F6"/>
  <rect x="525" y="453" width="30" height="3" rx="1" fill="#8B5CF6"/>
  
  <!-- People silhouettes (simplified) -->
  <circle cx="200" cy="380" r="20" fill="#3B82F6" opacity="0.7"/>
  <rect x="190" y="400" width="20" height="35" rx="10" fill="#3B82F6" opacity="0.7"/>
  
  <circle cx="450" cy="380" r="20" fill="#8B5CF6" opacity="0.7"/>
  <rect x="440" y="400" width="20" height="35" rx="10" fill="#8B5CF6" opacity="0.7"/>
  
  <circle cx="550" cy="380" r="20" fill="#06B6D4" opacity="0.7"/>
  <rect x="540" y="400" width="20" height="35" rx="10" fill="#06B6D4" opacity="0.7"/>
  
  <!-- Collaboration elements -->
  <path d="M220 390 Q280 350 340 390" stroke="#3B82F6" stroke-width="2" fill="none" opacity="0.6" stroke-dasharray="3,3"/>
  <path d="M470 390 Q500 370 530 390" stroke="#8B5CF6" stroke-width="2" fill="none" opacity="0.6" stroke-dasharray="3,3"/>
  
  <!-- Innovation/idea bubbles -->
  <circle cx="300" cy="200" r="40" fill="#3B82F6" opacity="0.1"/>
  <circle cx="500" cy="150" r="35" fill="#8B5CF6" opacity="0.1"/>
  <circle cx="600" cy="250" r="30" fill="#06B6D4" opacity="0.1"/>
  
  <!-- Light bulb shapes (ideas) -->
  <circle cx="300" cy="200" r="15" fill="none" stroke="#3B82F6" stroke-width="2"/>
  <rect x="295" y="212" width="10" height="8" fill="none" stroke="#3B82F6" stroke-width="2" rx="2"/>
  <line x1="292" y1="225" x2="308" y2="225" stroke="#3B82F6" stroke-width="2"/>
  
  <circle cx="500" cy="150" r="12" fill="none" stroke="#8B5CF6" stroke-width="2"/>
  <rect x="496" y="160" width="8" height="6" fill="none" stroke="#8B5CF6" stroke-width="2" rx="1"/>
  <line x1="494" y1="170" x2="506" y2="170" stroke="#8B5CF6" stroke-width="2"/>
  
  <!-- Chart/analytics elements -->
  <rect x="250" y="300" width="120" height="80" rx="10" fill="white" stroke="#CBD5E1" stroke-width="1"/>
  <rect x="260" y="350" width="8" height="20" fill="#3B82F6" rx="4"/>
  <rect x="275" y="340" width="8" height="30" fill="#8B5CF6" rx="4"/>
  <rect x="290" y="330" width="8" height="40" fill="#06B6D4" rx="4"/>
  <rect x="305" y="320" width="8" height="50" fill="#10B981" rx="4"/>
  <rect x="320" y="310" width="8" height="60" fill="#F59E0B" rx="4"/>
  
  <!-- Arrow showing growth -->
  <path d="M340 320 L360 300 L355 305 L360 300 L350 310" stroke="#10B981" stroke-width="3" fill="none"/>
  
  <!-- Meeting/discussion area -->
  <ellipse cx="400" cy="280" rx="80" ry="20" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <circle cx="360" cy="280" r="8" fill="#3B82F6" opacity="0.7"/>
  <circle cx="380" cy="280" r="8" fill="#8B5CF6" opacity="0.7"/>
  <circle cx="400" cy="280" r="8" fill="#06B6D4" opacity="0.7"/>
  <circle cx="420" cy="280" r="8" fill="#10B981" opacity="0.7"/>
  <circle cx="440" cy="280" r="8" fill="#F59E0B" opacity="0.7"/>
  
  <!-- Speech bubbles -->
  <ellipse cx="320" cy="240" rx="25" ry="15" fill="white" stroke="#CBD5E1" stroke-width="1"/>
  <polygon points="315,250 310,260 325,255" fill="white" stroke="#CBD5E1" stroke-width="1"/>
  
  <ellipse cx="480" cy="230" rx="20" ry="12" fill="white" stroke="#CBD5E1" stroke-width="1"/>
  <polygon points="470,240 465,250 480,245" fill="white" stroke="#CBD5E1" stroke-width="1"/>
  
  <!-- Background geometric shapes -->
  <polygon points="150,100 180,70 210,100 180,130" fill="#3B82F6" opacity="0.05"/>
  <polygon points="650,80 680,50 710,80 680,110" fill="#8B5CF6" opacity="0.05"/>
  <circle cx="700" cy="400" r="25" fill="#06B6D4" opacity="0.05"/>
  <circle cx="120" cy="200" r="30" fill="#10B981" opacity="0.05"/>
</svg>